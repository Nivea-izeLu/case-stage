<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="public/style_index.css" media="screen">
<title>Identificação - Empresa Fictícia</title>

</head>
<body>
    <header>
        <div class="logo">
            <img src="public/logo.png" alt="Logo EF">
        </div>
        <nav>
            <a href="#">Administração</a>
            <a href="#">Pagamentos</a>
            <a href="#" class="active">Mapeamentos</a>
            <a href="#">Funcionários</a>
            <a href="#">Fornecedores</a>
        </nav>
        <button class="icon-btn">→</button>
    </header>
    <div class="login-box">
        <h2>Identificação</h2>
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="funcionario@empresa.com">
        <label for="senha">Senha</label>
        <input type="password" id="senha" placeholder="******">
        <label for="idnum">Num. Identificação</label>
        <input type="text" id="idnum" placeholder="01234">
        <button>Enter</button>
    </div>
</body>
</html>
