<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="public/style_index.css" media="screen">
<title>Identificação - Empresa Fictícia</title>

</head>
<body>
    <header>
        <div class="logo">
            <img src="public/img/logo.png" alt="Logo da Empresa">
        </div>
        <nav>
            <a href="#">Administração</a>
            <a href="#">Pagamentos</a>
            <a href="#" class="active"><p>Mapeamentos</p></a>
            <a href="#">Funcionários</a>
            <a href="#">Fornecedores</a>
        </nav>
    </header>

    <div class="login-box">
            <h2>Identificação</h2>
            <label for="email">Email</label>
            <input type="email" id="email" placeholder="funcionario@empresa.com" required>
            <label for="senha">Senha</label>
            <input type="password" id="senha" placeholder="******" required>
            <label for="idnum">Nº Identificação</label>
            <input type="number" id="idnum" placeholder="01234" required>
            <button>
                <a href="public/Empresa Ficticia.html">Login</a>
            </button>
    </div>

    <footer>
        <p>&copy; 2025 Empresa Fictícia. Todos os direitos reservados.</p>
    </footer>
</body>
</html>
